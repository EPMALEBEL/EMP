nts.": "الغلاف الخارجي الواقي الذي يحتوي ويحمي المكوّنات الكهربائية والإلكترونية ومكوّنات التحكم الرئيسية للروبوت.", "Protects and monitors the 5-cell battery pack against overvoltage, undervoltage, overcurrent, short circuit and temperature faults.": "يحمي ويراقب حزمة البطارية ذات الخلايا الخمس من أعطال الجهد الزائد والجهد المنخفض والتيار الزائد والدائرة القصيرة ودرجة الحرارة.", "Provides 433 MHz wireless communication between the Robot Jockey and the remote control/system.": "يوفّر اتصالًا لاسلكيًا بتردد 433 ميغاهرتز بين الجوكي الآلي وجهاز/نظام التحكم عن بُعد.", "Provides electrical power to operate the motor, control system and other electronics.": "يوفّر الطاقة الكهربائية لتشغيل المحرك ونظام التحكم وبقية الإلكترونيات.", "Reduces motor speed and increases torque to provide the required driving force for the Robot Jockey and camel movement.": "يخفّض سرعة المحرك ويزيد عزم الدوران لتوفير قوة الدفع المطلوبة للجوكي الآلي وحركة الجمل.", "Test results, purchases and rework need a project manager's sign-off. An item can only be marked complete when nothing is pending or rejected.": "نتائج الاختبار والمشتريات وإعادة العمل تتطلب توقيع مدير المشروع. لا يمكن وسم البند كمكتمل إلا عندما لا يوجد شيء معلّق أو مرفوض.", "The STM32 is the main microcontroller (MCU) used to control and coordinate the Robot Jockey's electronic functions.": "STM32 هو المتحكم الدقيق الرئيسي (MCU) المستخدم للتحكم في الوظائف الإلكترونية للجوكي الآلي وتنسيقها.", "Three-phase gate driver used to control a BLDC/PMSM motor; receives control signals from the STM32 and drives the external power MOSFETs.": "مشغّل بوابات ثلاثي الأطوار للتحكم في محرك BLDC/PMSM؛ يستقبل إشارات التحكم من STM32 ويقود ترانزستورات MOSFET الخارجية.", "Datasheets, drawings, schematics, test reports, certificates (e.g. TDRA), photos. PDF and images up to 20 MB; Word, Excel, CAD or any other file up to 20 MB.": "أوراق البيانات والرسومات والمخططات وتقارير الاختبار والشهادات (مثل TDRA) والصور. ملفات PDF والصور حتى 20 ميغابايت؛ وملفات Word وE
